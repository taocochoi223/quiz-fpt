<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm bài | PRN232</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="quiz-page">
  <header class="quiz-header">
    <a class="brand" href="index.html"><span class="brand-mark">p</span><span>PRN232</span></a>
    <div class="header-actions">
      <button class="icon-btn" id="question-list-btn" type="button" aria-label="Mở danh sách câu hỏi">☰</button>
      <div class="timer" id="timer" aria-label="Thời gian còn lại"><span>◷</span><strong>00:00</strong></div>
    </div>
  </header>

  <main class="quiz-shell page-enter">
    <section class="quiz-status">
      <div class="status-row">
        <div><span class="status-label">Tiến độ bài làm</span><strong id="question-counter">Câu 1 / 25</strong></div>
        <span id="answered-counter">Đã làm 0 câu</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="quiz-progress"></div></div>
    </section>

    <section class="question-card" id="question-card">
      <div class="question-heading">
        <span class="question-number" id="question-number">Câu hỏi 01</span>
        <span class="topic-badge">PRN232</span>
      </div>
      <h1 id="question-text">Đang tải câu hỏi...</h1>
      <p class="answer-hint">Chọn một đáp án đúng</p>
      <div class="answers" id="answers"></div>
    </section>

    <nav class="quiz-navigation" aria-label="Điều hướng câu hỏi">
      <button class="btn btn-secondary" id="prev-btn" type="button"><span>←</span> Câu trước</button>
      <button class="btn btn-primary" id="next-btn" type="button">Câu tiếp <span>→</span></button>
    </nav>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="question-drawer" id="question-drawer" aria-hidden="true">
    <div class="drawer-header">
      <div><p class="section-kicker">Tổng quan</p><h2>Danh sách câu hỏi</h2></div>
      <button class="icon-btn" id="close-drawer" type="button" aria-label="Đóng">×</button>
    </div>
    <div class="drawer-legend">
      <span><i class="legend-dot unanswered"></i>Chưa làm</span>
      <span><i class="legend-dot answered"></i>Đã trả lời</span>
      <span><i class="legend-dot current"></i>Hiện tại</span>
    </div>
    <div class="question-grid" id="question-grid"></div>
    <button class="btn btn-outline submit-from-drawer" id="drawer-submit" type="button">Nộp bài</button>
  </aside>

  <div class="modal-backdrop" id="submit-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="submit-title">
      <div class="modal-icon warning">!</div>
      <h2 id="submit-title">Bạn có chắc muốn nộp bài?</h2>
      <p>Hãy kiểm tra lại trước khi hoàn tất bài kiểm tra.</p>
      <div class="modal-summary">
        <span><small>Đã trả lời</small><strong id="submit-answered">0</strong></span>
        <span><small>Chưa trả lời</small><strong id="submit-unanswered">0</strong></span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="continue-quiz" type="button">Tiếp tục</button>
        <button class="btn btn-primary" id="confirm-submit" type="button">Nộp bài</button>
      </div>
    </section>
  </div>

  <script src="js/questions.js?v=4"></script>
  <script src="js/quiz.js?v=4"></script>
</body>
</html>
