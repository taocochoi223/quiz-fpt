<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả | PRN232</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="result-page">
  <div class="page-glow glow-one"></div>
  <header class="simple-header"><a class="brand" href="index.html"><span class="brand-mark">p</span><span>PRN232</span></a></header>
  <main class="result-shell page-enter">
    <section class="result-card">
      <div class="result-copy">
        <span class="eyebrow">Hoàn thành bài kiểm tra</span>
        <h1 id="evaluation">Xuất sắc!</h1>
        <p id="result-message">Bạn đã hoàn thành rất tốt bài kiểm tra.</p>
      </div>

      <div class="score-ring" id="score-ring" style="--score: 0">
        <div class="score-ring-inner"><span>Điểm</span><strong><b id="correct-score">0</b> / <b id="total-score">0</b></strong><small id="percentage">0%</small></div>
      </div>

      <div class="result-stats">
        <article class="stat-card correct"><span>✓</span><div><small>Đúng</small><strong id="correct-count">0</strong></div></article>
        <article class="stat-card wrong"><span>×</span><div><small>Sai</small><strong id="wrong-count">0</strong></div></article>
        <article class="stat-card skipped"><span>–</span><div><small>Chưa làm</small><strong id="skipped-count">0</strong></div></article>
        <article class="stat-card time"><span>◷</span><div><small>Thời gian</small><strong id="time-spent">00:00</strong></div></article>
      </div>

      <div class="result-actions">
        <button class="btn btn-primary" id="retry-btn" type="button">↻ Làm lại</button>
        <a class="btn btn-outline" href="review.html">Xem đáp án</a>
        <a class="btn btn-secondary" href="index.html">Về trang chủ</a>
      </div>
    </section>
  </main>
  <script src="js/questions.js?v=4"></script>
  <script src="js/result.js"></script>
</body>
</html>
