<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ôn tập PRN232 bằng thẻ ghi nhớ">
  <title>Thẻ ghi nhớ | PRN232</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="study-page">
  <header class="quiz-header">
    <a class="brand" href="index.html"><span class="brand-mark">p</span><span>PRN232</span></a>
    <div class="header-actions">
      <a class="btn btn-secondary compact-btn" href="library.html">☷ 100 câu</a>
      <a class="icon-btn home-icon" href="index.html" aria-label="Về trang chủ">⌂</a>
    </div>
  </header>

  <main class="study-shell page-enter">
    <section class="study-topbar">
      <div>
        <p class="section-kicker">Chế độ ôn bài</p>
        <h1>Thẻ ghi nhớ</h1>
        <p>Nhấn vào thẻ hoặc phím Space để xem đáp án.</p>
      </div>
      <button class="btn btn-outline" id="reset-study" type="button">↻ Học lại từ đầu</button>
    </section>

    <section class="memory-progress">
      <div class="status-row">
        <strong id="card-counter">Thẻ 1 / 100</strong>
        <span id="known-counter">Đã nhớ 0 / 100</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="memory-progress-fill"></div></div>
    </section>

    <section class="flashcard-scene" aria-live="polite">
      <button class="flashcard" id="flashcard" type="button" aria-label="Lật thẻ ghi nhớ" aria-pressed="false">
        <span class="flashcard-inner">
          <span class="flashcard-face flashcard-front">
            <span class="flashcard-topline"><b id="front-number">Câu 01</b><i>Nhấn để lật ↻</i></span>
            <strong id="front-question">Đang tải câu hỏi...</strong>
            <span class="flashcard-hint">Bạn có nhớ đáp án không?</span>
          </span>
          <span class="flashcard-face flashcard-back">
            <span class="flashcard-topline"><b>Đáp án đúng</b><i>Nhấn để quay lại ↻</i></span>
            <span class="correct-answer-pill" id="back-key">A</span>
            <strong id="back-answer">Đáp án</strong>
            <span class="back-explanation" id="back-explanation">Giải thích</span>
          </span>
        </span>
      </button>
    </section>

    <section class="memory-actions">
      <button class="btn memory-btn review-again" id="review-again" type="button"><span>↻</span><div>Chưa nhớ<small>Ôn lại sau</small></div></button>
      <button class="btn memory-btn remembered" id="remembered" type="button"><span>✓</span><div>Đã nhớ<small>Chuyển câu tiếp</small></div></button>
    </section>

    <nav class="study-navigation">
      <button class="btn btn-secondary" id="study-prev" type="button">← Thẻ trước</button>
      <div class="keyboard-hint"><kbd>←</kbd><kbd>Space</kbd><kbd>→</kbd></div>
      <button class="btn btn-secondary" id="study-next" type="button">Thẻ tiếp →</button>
    </nav>
  </main>

  <div class="modal-backdrop" id="study-complete-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="study-complete-title">
      <div class="modal-icon">✓</div>
      <h2 id="study-complete-title">Bạn đã xem hết bộ thẻ!</h2>
      <p id="study-complete-message">Tiếp tục ôn các câu chưa nhớ hoặc học lại từ đầu.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="review-unknown" type="button">Ôn câu chưa nhớ</button>
        <a class="btn btn-primary" href="index.html">Hoàn tất</a>
      </div>
    </section>
  </div>

  <script src="js/questions.js?v=4"></script>
  <script src="js/study.js"></script>
</body>
</html>
