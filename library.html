<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Toàn bộ 100 câu hỏi ôn tập PRN232">
  <title>100 câu ôn tập | PRN232</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="library-page">
  <header class="quiz-header">
    <a class="brand" href="index.html"><span class="brand-mark">p</span><span>PRN232</span></a>
    <div class="header-actions">
      <a class="btn btn-secondary compact-btn" href="study.html">↻ Thẻ ghi nhớ</a>
      <a class="icon-btn home-icon" href="index.html" aria-label="Về trang chủ">⌂</a>
    </div>
  </header>

  <main class="library-shell page-enter">
    <section class="library-hero">
      <div>
        <p class="section-kicker">Ngân hàng kiến thức</p>
        <h1>Toàn bộ 100 câu ôn tập</h1>
        <p>Tìm kiếm câu hỏi và mở từng câu để xem đáp án cùng phần giải thích.</p>
      </div>
      <div class="library-count"><strong id="visible-count">100</strong><span>câu hỏi</span></div>
    </section>

    <section class="library-tools" aria-label="Công cụ lọc câu hỏi">
      <label class="search-box">
        <span>⌕</span>
        <input id="question-search" type="search" placeholder="Tìm câu hỏi hoặc đáp án..." autocomplete="off">
      </label>
      <div class="filter-group" id="library-filters">
        <button class="filter-btn active" type="button" data-filter="all">Tất cả</button>
        <button class="filter-btn" type="button" data-filter="known">Đã nhớ</button>
        <button class="filter-btn" type="button" data-filter="unknown">Chưa nhớ</button>
      </div>
      <button class="btn btn-outline reveal-all-btn" id="reveal-all" type="button">Hiện tất cả đáp án</button>
    </section>

    <div class="library-list" id="library-list"></div>
    <section class="empty-state" id="library-empty" hidden>
      <span>⌕</span>
      <h2>Không tìm thấy câu hỏi</h2>
      <p>Hãy thử một từ khóa hoặc bộ lọc khác.</p>
    </section>
  </main>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="Lên đầu trang">↑</button>
  <script src="js/questions.js?v=4"></script>
  <script src="js/library.js?v=4"></script>
</body>
</html>
